name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ksiegowy/api exec prisma generate --schema prisma/schema.prisma

      - name: Run typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @ksiegowy/types \
               --filter @ksiegowy/shared-utils \
               --filter @ksiegowy/fa3-xml \
               --filter @ksiegowy/ksef-client \
               --filter @ksiegowy/pdf-templates \
               build

      - name: Generate Prisma client
        run: pnpm --filter @ksiegowy/api exec prisma generate --schema prisma/schema.prisma

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ksiegowy/api exec prisma generate --schema prisma/schema.prisma

      - name: Build all packages and apps
        run: pnpm build

  container-build:
    name: Build Docker images (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: backup
            dockerfile: ops/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: ${{ matrix.name == 'api' }}
          tags: ksiegowy-vibe/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001

      - name: Verify API runtime image
        if: matrix.name == 'api'
        run: |
          set -euo pipefail

          application_image_name="ksiegowy-vibe/api:${{ github.sha }}"
          application_network_name="ksiegowy-api-smoke-${{ github.run_id }}"
          postgres_container_name="${application_network_name}-postgres"
          application_container_name="${application_network_name}-application"

          cleanup() {
            docker rm -f "$application_container_name" "$postgres_container_name" >/dev/null 2>&1 || true
            docker network rm "$application_network_name" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run --rm "$application_image_name" node -e \
            "require('@prisma/client'); console.log('Prisma runtime loaded')"

          docker network create "$application_network_name"
          docker run --detach \
            --name "$postgres_container_name" \
            --network "$application_network_name" \
            --network-alias postgres \
            --env POSTGRES_DB=ksiegowy_smoke \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --health-cmd='pg_isready -U postgres -d ksiegowy_smoke' \
            --health-interval=2s \
            --health-timeout=5s \
            --health-retries=30 \
            postgres:17

          for attempt in $(seq 1 30); do
            postgres_health_status="$(docker inspect --format='{{.State.Health.Status}}' "$postgres_container_name")"

            if [ "$postgres_health_status" = "healthy" ]; then
              break
            fi

            if [ "$postgres_health_status" = "unhealthy" ]; then
              docker logs "$postgres_container_name"
              exit 1
            fi

            sleep 2
          done

          postgres_health_status="$(docker inspect --format='{{.State.Health.Status}}' "$postgres_container_name")"
          if [ "$postgres_health_status" != "healthy" ]; then
            docker logs "$postgres_container_name"
            exit 1
          fi

          docker run --detach \
            --name "$application_container_name" \
            --network "$application_network_name" \
            --publish 127.0.0.1:3301:3001 \
            --env NODE_ENV=production \
            --env API_PORT=3001 \
            --env DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ksiegowy_smoke \
            --env JWT_SECRET=ci-smoke-access-secret \
            --env JWT_REFRESH_SECRET=ci-smoke-refresh-secret \
            "$application_image_name"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3301/health; then
              curl --fail --silent --show-error http://127.0.0.1:3301/ready
              echo "API container smoke test passed"
              exit 0
            fi

            application_running="$(docker inspect --format='{{.State.Running}}' "$application_container_name")"
            if [ "$application_running" != "true" ]; then
              docker logs "$application_container_name"
              exit 1
            fi

            sleep 2
          done

          docker logs "$application_container_name"
          exit 1

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ksiegowy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ksiegowy/api exec prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ksiegowy_test

      - name: Run database migrations
        run: pnpm --filter @ksiegowy/api exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ksiegowy_test

      - name: Run integration tests
        # TODO: replace with actual integration test command once tests are added
        run: echo "No integration tests yet — add test:integration script to run here"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ksiegowy_test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @ksiegowy/types \
               --filter @ksiegowy/shared-utils \
               --filter @ksiegowy/fa3-xml \
               --filter @ksiegowy/ksef-client \
               --filter @ksiegowy/pdf-templates \
               build

      - name: Generate Prisma client
        run: pnpm --filter @ksiegowy/api exec prisma generate --schema prisma/schema.prisma

      - name: Build web app
        run: pnpm --filter @ksiegowy/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Install Playwright browsers
        run: pnpm --filter @ksiegowy/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
