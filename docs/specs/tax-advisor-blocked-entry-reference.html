<!doctype html>
<html lang="pl" data-theme="light" data-size="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doradca — blocked-entry reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* One structure and one set of Aurora tokens for every state. */
    :root, html[data-theme="light"] {
      color-scheme: light;
      --canvas: #ECEEF8;
      --background: #E4E8F4;
      --chrome: #F4F6FC;
      --panel: #FFFFFF;
      --inset: #F0F2FA;
      --foreground: #141731;
      --secondary: rgba(20, 23, 49, .72);
      --muted: rgba(20, 23, 49, .64);
      --disabled: rgba(20, 23, 49, .55);
      --border: rgba(20, 23, 49, .10);
      --border-strong: rgba(20, 23, 49, .16);
      --control-border: #7F86A2;
      --primary: #6D3AE0;
      --primary-soft: rgba(109, 58, 224, .14);
      --warning: #8A5300;
      --scrim: rgba(20, 23, 49, .72);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0D1024;
      --background: #080A14;
      --chrome: #0A0C18;
      --panel: #10132A;
      --inset: #171B36;
      --foreground: #ECEEF7;
      --secondary: rgba(236, 238, 247, .72);
      --muted: rgba(236, 238, 247, .60);
      --disabled: rgba(236, 238, 247, .45);
      --border: rgba(236, 238, 247, .10);
      --border-strong: rgba(236, 238, 247, .14);
      --control-border: #6B7398;
      --primary: #A78BFA;
      --primary-soft: rgba(167, 139, 250, .14);
      --warning: #F5BE5A;
      --scrim: rgba(8, 10, 20, .72);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--foreground); font: 13.5px/1.5 Sora, sans-serif; }
    button, textarea, a { font: inherit; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .screen { position: relative; display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: var(--background); }
    .topbar { z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; padding: 0 22px; flex: none; border-bottom: 1px solid var(--border); background: var(--chrome); }
    .brand-group, .topbar-actions { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .brand { display: block; width: 150px; height: auto; flex: none; }
    html[data-theme="dark"] .brand-light, html[data-theme="light"] .brand-dark { display: none; }
    .company { overflow: hidden; max-width: 165px; padding: 5px 9px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--panel); text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
    .environment { padding: 3px 7px; border: 1px solid var(--border-strong); border-radius: 6px; color: var(--warning); font: 500 11px IBM Plex Mono, monospace; }
    .open-trigger { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 13px; border: 1px solid var(--primary); border-radius: 9px; background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .dashboard { display: grid; grid-template-columns: 226px minmax(0, 1fr) 400px; min-height: 0; flex: 1; }
    .rail { display: flex; flex-direction: column; padding: 18px 14px; border-right: 1px solid var(--border); background: var(--chrome); }
    .rail span { display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 9px; color: var(--muted); font-size: 14px; }
    .rail .current { border: 1px solid var(--border-strong); background: var(--primary-soft); color: var(--foreground); font-weight: 500; }
    .rail .settings { margin-top: auto; }
    .workspace { min-width: 0; padding: 22px 26px; }
    .workspace h1 { margin: 0; font-size: 25px; font-weight: 600; line-height: 1.3; }
    .bottom-navigation, .scrim, .grabber { display: none; }
    .advisor { display: flex; min-height: 0; flex-direction: column; border-left: 1px solid var(--border-strong); background: var(--panel); }
    .advisor-header { display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px; border-bottom: 1px solid var(--border); }
    .advisor-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .advisor-actions { display: flex; gap: 4px; }
    .icon-button { display: inline-grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 9px; background: transparent; color: var(--secondary); font-size: 21px; cursor: pointer; }
    .icon-button:hover { background: var(--inset); }
    .context { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; min-height: 38px; padding: 8px 16px; border-bottom: 1px solid var(--border); color: var(--muted); font: 11px/1.5 IBM Plex Mono, monospace; }
    .context .test { color: var(--warning); }
    .advisor-body { min-height: 0; flex: 1; overflow-y: auto; background: var(--panel); }
    .blocker { margin: 16px; padding: 16px; border: 1px solid var(--border); border-left: 3px solid var(--warning); border-radius: 12px; background: var(--inset); }
    .blocker h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
    .blocker p { margin: 6px 0 14px; color: var(--secondary); font-size: 13.5px; line-height: 1.5; }
    .settings-action { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 9px 12px; border: 1px solid var(--control-border); border-radius: 9px; background: var(--panel); color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; }
    .settings-action:hover { border-color: var(--primary); }
    .settings-action span:first-child { min-width: 0; overflow-wrap: anywhere; }
    .composer { flex: none; padding: 16px; border-top: 1px solid var(--border); background: var(--panel); }
    .composer-field { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--inset); }
    .composer textarea { display: block; width: 100%; height: 58px; padding: 0; resize: none; border: 0; background: transparent; color: var(--disabled); font-size: 13px; line-height: 1.5; }
    .composer textarea::placeholder { color: var(--disabled); opacity: 1; }
    .composer-bottom { display: flex; justify-content: flex-end; }
    .composer button { min-height: 44px; padding: 0 16px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--panel); color: var(--disabled); cursor: not-allowed; }
    .composer-hint { margin: 9px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; }
    html[data-size="mobile"] .screen { width: 390px; height: 844px; }
    html[data-size="mobile"] .topbar { padding: 0 16px; gap: 6px; }
    html[data-size="mobile"] .brand-group { gap: 7px; }
    html[data-size="mobile"] .brand { width: 110px; }
    html[data-size="mobile"] .company { max-width: 145px; padding: 4px 7px; font-size: 11px; }
    html[data-size="mobile"] .open-trigger { display: none; }
    html[data-size="mobile"] .dashboard { display: block; }
    html[data-size="mobile"] .rail { display: none; }
    html[data-size="mobile"] .workspace { padding: 16px; }
    html[data-size="mobile"] .workspace h1 { font-size: 20px; }
    html[data-size="mobile"] .bottom-navigation { display: flex; align-items: center; justify-content: space-around; height: 90px; flex: none; border-top: 1px solid var(--border); background: var(--chrome); color: var(--muted); font-size: 12px; }
    html[data-size="mobile"] .bottom-navigation .advisor-entry { display: inline-grid; min-width: 44px; min-height: 44px; place-items: center; padding: 0; border: 0; background: transparent; color: var(--primary); font-weight: 600; cursor: pointer; }
    html[data-size="mobile"] .scrim { position: absolute; z-index: 2; inset: 0; display: block; background: var(--scrim); }
    html[data-size="mobile"] .advisor { position: absolute; z-index: 3; right: 0; bottom: 0; left: 0; height: 90dvh; max-height: 760px; border: 1px solid var(--border-strong); border-bottom: 0; border-radius: 26px 26px 0 0; overflow: hidden; }
    html[data-size="mobile"] .grabber { display: block; width: 40px; height: 4px; margin: 10px auto 0; border-radius: 99px; background: var(--control-border); }
    html[data-size="mobile"] .advisor-header { min-height: 56px; }
    html[data-size="mobile"] .advisor-header h2 { font-size: 16px; }
    html[data-size="mobile"] .context { min-height: 42px; }
    html[data-size="mobile"] .blocker { margin: 14px 16px; }
    html[data-size="mobile"] .composer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .screen[data-closed="true"] .dashboard { grid-template-columns: 226px minmax(0, 1fr); }
    .screen[data-closed="true"] .advisor, .screen[data-closed="true"] .scrim { display: none; }
    .screen[data-expanded="true"] .advisor { position: absolute; z-index: 3; inset: 60px 0 0; width: auto; height: auto; border-radius: 0; }
    html[data-size="mobile"] .screen[data-expanded="true"] .advisor { inset: 0; width: 390px; height: 844px; max-height: none; }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand-group">
        <img class="brand brand-light" src="../../apps/web/src/components/brand/assets/ksiegowy-vibe-horizontal-light.svg" alt="Księgowy Vibe">
        <img class="brand brand-dark" src="../../apps/web/src/components/brand/assets/ksiegowy-vibe-horizontal-dark.svg" alt="Księgowy Vibe">
        <span class="company">Firma przykładowa</span>
      </div>
      <div class="topbar-actions">
        <span class="environment">TEST</span>
        <button class="open-trigger" data-open-advisor type="button" aria-expanded="true">Doradca</button>
      </div>
    </header>
    <div class="dashboard">
      <nav class="rail" aria-label="Nawigacja dashboardu">
        <span class="current" aria-current="page">Przegląd</span>
        <span>Sprzedaż (KSeF)</span>
        <span>Zakupy i koszty</span>
        <span>OCR Inbox</span>
        <span>Kontrahenci</span>
        <span>Raporty &amp; JPK</span>
        <span class="settings">Ustawienia</span>
      </nav>
      <main class="workspace"><h1>Przegląd</h1></main>
      <aside class="advisor" aria-label="Doradca">
        <div class="grabber" aria-hidden="true"></div>
        <header class="advisor-header">
          <h2>Doradca</h2>
          <div class="advisor-actions">
            <button class="icon-button" data-expand-advisor type="button" aria-label="Rozwiń Doradcę">↗</button>
            <button class="icon-button" data-close-advisor type="button" aria-label="Zamknij Doradcę">×</button>
          </div>
        </header>
        <div class="context"><span data-provider></span><span aria-hidden="true">·</span><span class="test">TEST</span><span aria-hidden="true">·</span><span>2026-10</span><span aria-hidden="true">·</span><span>Firma przykładowa</span></div>
        <div class="advisor-body">
          <section class="blocker" aria-labelledby="blocker-reason">
            <h3 id="blocker-reason"></h3>
            <p id="blocker-owner"></p>
            <a class="settings-action" href="/dashboard/settings?section=advisor"><span>Otwórz ustawienia Doradcy</span><span aria-hidden="true">→</span></a>
          </section>
        </div>
        <div class="composer">
          <div class="composer-field">
            <textarea disabled aria-label="Pytanie do Doradcy" placeholder="Zadaj pytanie asystentowi podatkowemu..."></textarea>
            <div class="composer-bottom"><button type="button" disabled>Zapytaj</button></div>
          </div>
          <p class="composer-hint" id="blocker-hint"></p>
        </div>
      </aside>
    </div>
    <nav class="bottom-navigation" aria-label="Mobilna nawigacja dashboardu"><span>Start</span><span>Zakupy</span><button class="advisor-entry" data-open-advisor type="button" aria-expanded="true">Doradca</button><span>Sprzedaż</span><span>Więcej</span></nav>
    <div class="scrim" aria-hidden="true"></div>
  </div>
  <script>
    const blockedStates = {
      operator: {
        provider: 'OpenRouter',
        reason: 'Doradca jest wyłączony na serwerze.',
        owner: 'Może go włączyć operator usługi.',
        hint: 'Nie możesz wysłać pytania, dopóki operator nie włączy doradcy.'
      },
      company: {
        provider: 'Anthropic API',
        reason: 'Doradca jest wyłączony dla tej firmy.',
        owner: 'Może go włączyć administrator firmy.',
        hint: 'Nie możesz wysłać pytania, dopóki administrator firmy nie włączy doradcy.'
      },
      provider: {
        provider: 'Anthropic API',
        reason: 'Dostawca Anthropic API nie jest dozwolony w tej firmie.',
        owner: 'Może go dopuścić administrator firmy.',
        hint: 'Nie możesz wysłać pytania przez Anthropic API, dopóki administrator firmy nie zezwoli na tego dostawcę.'
      },
      connection: {
        provider: 'Anthropic API',
        reason: 'Nie masz jeszcze zapisanego połączenia z Anthropic API.',
        owner: 'Możesz je zapisać dla swojego konta w tej firmie.',
        hint: 'Nie możesz wysłać pytania przez Anthropic API, dopóki nie zapiszesz połączenia.'
      }
    };
    const parameters = new URLSearchParams(window.location.search);
    const stateName = parameters.get('state');
    const themeName = parameters.get('theme');
    const sizeName = parameters.get('size');
    const blockedState = blockedStates[stateName] || blockedStates.operator;
    document.documentElement.dataset.theme = themeName === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.size = sizeName === 'mobile' ? 'mobile' : 'desktop';
    document.title = `Doradca — ${stateName || 'operator'} — ${document.documentElement.dataset.size} — ${document.documentElement.dataset.theme}`;
    document.querySelector('[data-provider]').textContent = blockedState.provider;
    document.querySelector('#blocker-reason').textContent = blockedState.reason;
    document.querySelector('#blocker-owner').textContent = blockedState.owner;
    document.querySelector('#blocker-hint').textContent = blockedState.hint;
    const screen = document.querySelector('.screen');
    const openTriggers = document.querySelectorAll('[data-open-advisor]');
    openTriggers.forEach((trigger) => trigger.addEventListener('click', () => {
      screen.dataset.closed = 'false';
      openTriggers.forEach((openTrigger) => openTrigger.setAttribute('aria-expanded', 'true'));
      document.querySelector('[data-close-advisor]').focus();
    }));
    document.querySelector('[data-close-advisor]').addEventListener('click', () => {
      screen.dataset.closed = 'true';
      screen.dataset.expanded = 'false';
      openTriggers.forEach((trigger) => trigger.setAttribute('aria-expanded', 'false'));
      document.querySelector(document.documentElement.dataset.size === 'mobile' ? '.advisor-entry' : '.open-trigger').focus();
    });
    document.querySelector('[data-expand-advisor]').addEventListener('click', (event) => {
      screen.dataset.expanded = screen.dataset.expanded === 'true' ? 'false' : 'true';
      event.currentTarget.setAttribute('aria-label', screen.dataset.expanded === 'true' ? 'Zwiń Doradcę' : 'Rozwiń Doradcę');
    });
  </script>
</body>
</html>
