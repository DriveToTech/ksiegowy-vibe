# Local-only placeholder config for Docker Compose backup profile.
#
# Local-only mode:
# - keep this file empty
# - leave DB_BACKUP_REMOTE_PRIMARY_NAME and DB_BACKUP_REMOTE_SECONDARY_NAME unset
