services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ksiegowy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ksiegowy_dev}
      HOUSEHOLD_POSTGRES_DB: ${HOUSEHOLD_POSTGRES_DB:-ksiegowy_household}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ksiegowy} -d ${POSTGRES_DB:-ksiegowy_dev}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the household (personal mode) database on first boot only —
      # see ops/postgres/init-household-db.sh.
      - ./ops/postgres/init-household-db.sh:/docker-entrypoint-initdb.d/init-household-db.sh:ro

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - '${ADMINER_HOST_PORT:-8080}:8080'
    depends_on:
      - postgres
    profiles:
      - tools

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '${API_HOST_PORT:-3001}:3001'
    depends_on:
      - postgres
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ksiegowy}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-ksiegowy_dev}
      HOUSEHOLD_DATABASE_URL: postgresql://${POSTGRES_USER:-ksiegowy}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${HOUSEHOLD_POSTGRES_DB:-ksiegowy_household}?connection_limit=5
      CORS_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
      STORAGE_BASE_PATH: /app/storage
      POSTGRESQL_BACKUP_ARTIFACTS_PATH: /app/backups/postgresql
      BACKUP_DESTINATION_ROOT: ${BACKUP_DESTINATION_ROOT:-ksiegowy-vibe-backups}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - ./storage:/app/storage
      - ${DB_BACKUP_LOCAL_PATH:-./backups/postgresql}:/app/backups/postgresql:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-3001}
    restart: unless-stopped
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-3001}
      API_URL: http://api:3001
      APP_URL: http://localhost:${WEB_HOST_PORT:-3000}

  backup-postgres:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: 'no'
    profiles:
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ksiegowy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ksiegowy_dev}
      HOUSEHOLD_POSTGRES_DB: ${HOUSEHOLD_POSTGRES_DB:-ksiegowy_household}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      DB_BACKUP_ENABLED: ${DB_BACKUP_ENABLED:-false}
      DB_BACKUP_ENVIRONMENT_NAME: ${DB_BACKUP_ENVIRONMENT_NAME:-local}
      DB_BACKUP_RETENTION_DAYS: ${DB_BACKUP_RETENTION_DAYS:-14}
      DB_BACKUP_LOCAL_RETENTION_DAYS: ${DB_BACKUP_LOCAL_RETENTION_DAYS:-14}
      DB_BACKUP_POSTGRES_READY_TIMEOUT_SECONDS: ${DB_BACKUP_POSTGRES_READY_TIMEOUT_SECONDS:-120}
      BACKUP_DESTINATION_ROOT: ${BACKUP_DESTINATION_ROOT:-ksiegowy-vibe-backups}
      DB_BACKUP_REMOTE_PRIMARY_NAME: ${DB_BACKUP_REMOTE_PRIMARY_NAME:-}
      DB_BACKUP_REMOTE_SECONDARY_NAME: ${DB_BACKUP_REMOTE_SECONDARY_NAME:-}
      DB_BACKUP_RCLONE_CONFIG_PATH: /tmp/rclone-runtime/rclone.conf
      DB_BACKUP_RCLONE_SOURCE_CONFIG_PATH: /tmp/rclone-source/rclone.conf
    volumes:
      - ${DB_BACKUP_LOCAL_PATH:-./backups/postgresql}:/backup-output
      - ${DB_BACKUP_RCLONE_CONFIG_PATH:-./ops/backup/rclone/rclone.conf}:/tmp/rclone-source/rclone.conf:ro
      - backup_postgres_rclone_runtime:/tmp/rclone-runtime

  download-postgres-backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: 'no'
    profiles:
      - backup
    entrypoint: ["/usr/local/bin/download-postgres-backup.sh"]
    env_file: .env
    environment:
      DB_BACKUP_ENVIRONMENT_NAME: ${DB_BACKUP_ENVIRONMENT_NAME:-production}
      BACKUP_DESTINATION_ROOT: ${BACKUP_DESTINATION_ROOT:-ksiegowy-vibe-backups}
      DB_BACKUP_REMOTE_PRIMARY_NAME: ${DB_BACKUP_REMOTE_PRIMARY_NAME:-}
      DB_BACKUP_RCLONE_CONFIG_PATH: /tmp/rclone-runtime/rclone.conf
      DB_BACKUP_RCLONE_SOURCE_CONFIG_PATH: /tmp/rclone-source/rclone.conf
    volumes:
      - ${DB_BACKUP_LOCAL_PATH:-./backups/postgresql}:/backup-output
      - ${DB_BACKUP_RCLONE_CONFIG_PATH:-./ops/backup/rclone/rclone.conf}:/tmp/rclone-source/rclone.conf:ro
      - backup_postgres_rclone_runtime:/tmp/rclone-runtime

  restore-postgres:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: 'no'
    profiles:
      - backup
    entrypoint: ["/usr/local/bin/run-postgres-restore.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ksiegowy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ksiegowy_dev}
      HOUSEHOLD_POSTGRES_DB: ${HOUSEHOLD_POSTGRES_DB:-ksiegowy_household}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      DB_RESTORE_ENVIRONMENT_NAME: ${DB_RESTORE_ENVIRONMENT_NAME:-production}
      DB_RESTORE_DATABASE_LABEL: ${DB_RESTORE_DATABASE_LABEL:-business}
      DB_RESTORE_ARTIFACT_NAME: ${DB_RESTORE_ARTIFACT_NAME:-}
      DB_RESTORE_CONFIRMED: ${DB_RESTORE_CONFIRMED:-}
      DB_BACKUP_POSTGRES_READY_TIMEOUT_SECONDS: ${DB_BACKUP_POSTGRES_READY_TIMEOUT_SECONDS:-120}
    volumes:
      - ${DB_BACKUP_LOCAL_PATH:-./backups/postgresql}:/backup-output:ro

  backup-gdrive-scheduled:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    profiles:
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ksiegowy}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-ksiegowy_dev}
      STORAGE_BASE_PATH: /app/storage
      BACKUP_DESTINATION_ROOT: ${BACKUP_DESTINATION_ROOT:-ksiegowy-vibe-backups}
    command: ['node', 'dist/scheduled-company-google-drive-backup-runner.js']
    volumes:
      - ./storage:/app/storage:ro

  verify-backups:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: 'no'
    profiles:
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ksiegowy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ksiegowy_dev}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      DB_BACKUP_ENABLED: ${DB_BACKUP_ENABLED:-false}
      DB_BACKUP_ENVIRONMENT_NAME: ${DB_BACKUP_ENVIRONMENT_NAME:-local}
      DB_BACKUP_POSTGRES_READY_TIMEOUT_SECONDS: ${DB_BACKUP_POSTGRES_READY_TIMEOUT_SECONDS:-120}
      BACKUP_FRESHNESS_ENABLED: ${BACKUP_FRESHNESS_ENABLED:-true}
      BACKUP_FRESHNESS_REQUIRE_POSTGRESQL_BACKUP: ${BACKUP_FRESHNESS_REQUIRE_POSTGRESQL_BACKUP:-auto}
      BACKUP_FRESHNESS_REQUIRE_GDRIVE_BACKUP: ${BACKUP_FRESHNESS_REQUIRE_GDRIVE_BACKUP:-auto}
      BACKUP_FRESHNESS_REQUIRE_ICLOUD_BACKUP: ${BACKUP_FRESHNESS_REQUIRE_ICLOUD_BACKUP:-auto}
      BACKUP_FRESHNESS_POSTGRESQL_MAX_AGE_HOURS: ${BACKUP_FRESHNESS_POSTGRESQL_MAX_AGE_HOURS:-30}
      BACKUP_FRESHNESS_GDRIVE_MAX_AGE_HOURS: ${BACKUP_FRESHNESS_GDRIVE_MAX_AGE_HOURS:-30}
      BACKUP_FRESHNESS_ICLOUD_MAX_AGE_HOURS: ${BACKUP_FRESHNESS_ICLOUD_MAX_AGE_HOURS:-30}
    entrypoint: ["/usr/local/bin/check-backup-freshness.sh"]
    volumes:
      - ${DB_BACKUP_LOCAL_PATH:-./backups/postgresql}:/backup-output

volumes:
  postgres_data:
  storage:
  backup_postgres_rclone_runtime:
